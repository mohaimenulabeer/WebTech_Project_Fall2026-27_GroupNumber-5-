<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Patient List | MediConnect</title>
    <link rel="stylesheet" href="receptionist.css">
</head>

<body data-page="patients">
    <header class="top">
        <div class="brand">✚ <span>Medi</span>Connect</div>
    </header>
    <div class="layout">
        <aside><a href="dashboard.html">Dashboard</a><a href="register-patient.html">Register Patient</a><a
                href="patients.html">Patient List</a><a href="book-appointment.html">Book Appointment</a><a
                href="appointments.html">Manage Appointments</a><a href="check-in.html">Check-in Patients</a><a
                href="billing.html">Billing & Payments</a></aside>
        <main>
            <div class="heading">
                <div>
                    <h1>Patient List</h1>
                    <div class="muted">Manage clinic front desk operations</div>
                </div><span class="pill">Receptionist</span>
            </div>
            <div id="notice"></div>
            <div class="toolbar"><input id="search" placeholder="Search by name, ID, phone, email"><a
                    href="register-patient.html" class="btn">+ Add Patient</a></div>
            <div class="panel">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th>Gender</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="list"></tbody>
                </table>
            </div>
            <div class="panel" id="editor" hidden>
                <h2>Edit Patient</h2><input type="hidden" id="editId">
                <form id="editForm">
                    <div class="form-grid">
                        <div class="field"><label for="edit_name">Name</label><input id="edit_name" name="name"
                                type="text" required></div>
                        <div class="field"><label for="edit_phone">Phone</label><input id="edit_phone" name="phone"
                                type="text" required></div>
                        <div class="field"><label for="edit_email">Email</label><input id="edit_email" name="email"
                                type="email"></div>
                        <div class="field"><label for="edit_dob">Date of Birth</label><input id="edit_dob" name="dob"
                                type="date"></div>
                        <div class="field"><label for="gender">Gender</label><select name="gender" id="edit_gender"
                                required>
                                <option>Male</option>
                                <option>Female</option>
                                <option>Other</option>
                            </select></div>
                        <div class="field"><label for="blood">Blood Group</label><select name="blood" id="edit_blood"
                                required>
                                <option>Unknown</option>
                                <option>A+</option>
                                <option>A-</option>
                                <option>B+</option>
                                <option>B-</option>
                                <option>AB+</option>
                                <option>AB-</option>
                                <option>O+</option>
                                <option>O-</option>
                            </select></div>
                        <div class="field"><label for="edit_address">Address</label><input id="edit_address"
                                name="address" type="text"></div>
                    </div>
                    <p><button class="btn" type="submit">Save Changes</button></p>
                </form>
            </div>
        </main>
    </div>
    <script src="receptionist.js"></script>
</body>

</html>
