<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Book Appointment | MediConnect</title>
    <link rel="stylesheet" href="receptionist.css">
</head>

<body data-page="book">
    <header class="top">
        <div class="brand">✚ <span>Medi</span>Connect</div>
    </header>
    <div class="layout">
        <aside><a href="dashboard.html">Dashboard</a><a href="register-patient.html">Register Patient</a><a
                href="patients.html">Patient List</a><a href="book-appointment.html">Book Appointment</a><a
                href="appointments.html">Manage Appointments</a><a href="check-in.html">Check-in Patients</a><a
                href="billing.html">Billing & Payments</a></aside>
        <main>
            <div class="heading">
                <div>
                    <h1>Book Appointment</h1>
                    <div class="muted">Manage clinic front desk operations</div>
                </div><span class="pill">Receptionist</span>
            </div>
            <div id="notice"></div>
            <div class="panel">
                <h2>Schedule an Appointment</h2>
                <form id="bookingForm">
                    <div class="form-grid">
                        <div class="field"><label for="patientId">Patient</label><select name="patientId" id="patientId"
                                required></select></div>
                        <div class="field"><label for="doctorId">Doctor</label><select name="doctorId" id="doctorId"
                                required></select></div>
                        <div class="field"><label for="date">Appointment Date</label><input id="date" name="date"
                                type="date" required></div>
                        <div class="field"><label for="time">Time</label><input id="time" name="time" type="time"
                                required></div>
                        <div class="field"><label for="reason">Reason for Visit</label><input id="reason" name="reason"
                                type="text" required></div>
                    </div>
                    <p><button class="btn" type="submit">Book Appointment</button></p>
                </form>
            </div>
        </main>
    </div>
    <script src="receptionist.js"></script>
</body>

</html>
