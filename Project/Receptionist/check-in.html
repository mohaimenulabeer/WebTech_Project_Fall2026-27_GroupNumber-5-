<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Patient Check-in | MediConnect</title>
    <link rel="stylesheet" href="receptionist.css">
</head>

<body data-page="checkin">
    <header class="top">
        <div class="brand">✚ <span>Medi</span>Connect</div>
    </header>
    <div class="layout">
        <aside><a href="dashboard.html">Dashboard</a><a href="register-patient.html">Register Patient</a><a
                href="patients.html">Patient List</a><a href="book-appointment.html">Book Appointment</a><a
                href="appointments.html">Manage Appointments</a><a href="check-in.html">Check-in Patients</a><a
                href="billing.html">Billing & Payments</a></aside>
        <main>
            <div class="heading">
                <div>
                    <h1>Patient Check-in</h1>
                    <div class="muted">Manage clinic front desk operations</div>
                </div><span class="pill">Receptionist</span>
            </div>
            <div id="notice"></div>
            <div class="split">
                <div class="panel">
                    <h2>Find Appointment</h2>
                    <form id="checkForm">
                        <div class="form-grid">
                            <div class="field"><label for="appointmentId">Appointment ID</label><input
                                    id="appointmentId" name="appointmentId" type="text" required></div>
                        </div>
                        <p><button class="btn" type="submit">Search Appointment</button></p>
                    </form>
                </div>
                <div class="panel">
                    <h2>Appointment Details</h2>
                    <div id="result" class="muted">Enter an appointment ID to find a patient.</div>
                </div>
            </div>
        </main>
    </div>
    <script src="receptionist.js"></script>
</body>

</html>
