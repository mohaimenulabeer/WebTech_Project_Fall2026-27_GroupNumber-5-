        <script src="../JS/Common.js"></script>
        <script src="../JS/Management.js"></script>
    </head>
    <body class="admin">
        <img src="../Images/logo.svg" id="logo" alt="Clinic Logo">
        <div class="header"><h1>Admin Account Settings</h1></div>
        <div class="topnav">
            <a href="../index.html">Home</a>
            <a href="AdminLogin.html">Login</a>
            <a href="AdminRegistration.html">Registration</a>

        <form onsubmit="return saveAdminSettings()" novalidate>
            <fieldset>
                <legend>Change Admin Password</legend>
                <table>
                    <tr>
                        <td><label for="NewPassword">New Password:</label></td>
                        <td><input type="password" id="NewPassword" placeholder="Minimum 6 characters"></td>
                    </tr>
                    <tr>
                        <td><label for="ConfirmPassword">Confirm Password:</label></td>
                        <td><input type="password" id="ConfirmPassword" placeholder="Re-enter password"></td>
                    </tr>
                </table>
                <br>
                <input type="submit" value="Update Password">
                <p id="ResultText"></p>
            </fieldset>
        </form>
        <div class="footer"><h5>Created By Rifat Rudro</h5></div>
    </body>
