<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Admin Login</title>
        <link rel="stylesheet" href="../Design/Style.css">
        <script src="../JS/Common.js"></script>
    </head>

    <body class="admin" onload="makeCaptcha()">
        <img src="../Images/logo.svg" id="logo" alt="Clinic Logo">

        <div class="header">
            <h1>Admin Login</h1>
        </div>

        <div class="topnav">
            <a href="../index.html">Home</a>
            <a href="AdminLogin.html" class="active">Login</a>
            <a href="AdminRegistration.html">Registration</a>
            <a href="AddStaff.html">Add Staff</a>
            <a href="ManageDepartment.html">Departments</a>
            <a href="GenerateReport.html">Reports</a>
        </div>

        <form onsubmit="return validateAdminLogin()" onreset="clearAllErrors()" novalidate>
            <fieldset>
                <legend>Sign In</legend>
                <table>
                    <tr>
                        <td><label for="AdminID">Admin ID:</label></td>
                        <td><input type="text" id="AdminID" placeholder="e.g. ADM-1234">
                            <p class="error" id="AdminIDError"></p></td>
                    </tr>
                    <tr>
                        <td><label for="Password">Password:</label></td>
                        <td><input type="password" id="Password" placeholder="Enter password">
                            <label class="choice"><input type="checkbox" onclick="togglePassword('Password', this)"> Show password</label>
                            <p class="error" id="PasswordError"></p></td>
                    </tr>
                    <tr>
                        <td><label for="Captcha">Security Check:</label></td>
                        <td><p id="CaptchaQuestion"></p>
                            <input type="number" id="Captcha" placeholder="Your answer">
                            <button type="button" class="small-btn" onclick="makeCaptcha()">New question</button>
                            <p class="error" id="CaptchaError"></p></td>
                    </tr>
                    <tr>
                        <td></td>
                        <td><label class="choice"><input type="checkbox" id="Remember"> Remember me on this computer</label></td>
                    </tr>
                </table>
            </fieldset>

            <p id="ResultText"></p>

            <input type="submit" id="submit" value="Login">
            <input type="reset" id="reset" value="Reset">
            <p class="hint">New admin? <a href="AdminRegistration.html">Register here</a></p>
        </form>

        <div class="footer">
            <h5>Clinic Management System &copy; 2026</h5>
        </div>
    </body>
</html>
