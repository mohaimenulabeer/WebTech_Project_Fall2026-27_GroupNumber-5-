<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Manage Departments</title>
        <link rel="stylesheet" href="../Design/Style.css">
        <script src="../JS/Common.js"></script>
        <script src="../JS/AdminPanel.js"></script>
    </head>
    <body class="admin" onload="renderDepartments()">
        <img src="../Images/logo.svg" id="logo" alt="Clinic Logo">
        <div class="header"><h1>Manage Departments</h1></div>
        <div class="topnav">
            <a href="../index.html">Home</a>
            <a href="AdminLogin.html">Login</a>
            <a href="AdminRegistration.html">Registration</a>
            <a href="Dashboard.html">Dashboard</a>
            <a href="AddStaff.html">Add Staff</a>
            <a href="ManageDepartment.html" class="active">Departments</a>
            <a href="GenerateReport.html">Reports</a>
            <a href="#" onclick="logoutAdmin()">Logout</a>
        </div>
        <form id="DeptForm" onsubmit="return addDepartment()" novalidate>
            <fieldset>
                <legend>Add New Department</legend>
                <table>
                    <tr>
                        <td><label for="DeptID">Department ID:</label></td>
                        <td><input type="text" id="DeptID" placeholder="e.g. DEPT-05"></td>
                    </tr>
                    <tr>
                        <td><label for="DeptName">Department Name:</label></td>
                        <td><input type="text" id="DeptName" placeholder="e.g. Orthopedics"></td>
                    </tr>
                    <tr>
                        <td><label for="DeptHead">Head of Department:</label></td>
                        <td><input type="text" id="DeptHead" placeholder="e.g. Dr. Shafiqul Alam"></td>
                    </tr>
                    <tr>
                        <td><label for="DeptRooms">Room Numbers:</label></td>
                        <td><input type="text" id="DeptRooms" placeholder="e.g. 501 - 504"></td>
                    </tr>
                </table>
                <br>
                <input type="submit" value="Save Department">
                <p id="ResultText"></p>
            </fieldset>

            <fieldset>
                <legend>Department List</legend>
                <table class="data-table">
                    <thead>
                        <tr><th>Dept ID</th><th>Department Name</th><th>Head</th><th>Rooms</th><th>Action</th></tr>
                    </thead>
                    <tbody id="DepartmentsTableBody"></tbody>
                </table>
            </fieldset>
        </form>
        <div class="footer"><h5>Clinic Management System &copy; 2026</h5></div>
    </body>
</html>
