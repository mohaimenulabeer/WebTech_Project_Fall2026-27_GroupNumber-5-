<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leave Application</title>
    <link rel="stylesheet" href="css/doctor.css" />
  </head>
  <body>
    <div class="app-layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="brand">
          <h2>Doctor Portal</h2>
          <p>Hospital Management System</p>
        </div>
        <nav class="sidebar-nav">
          <a href="../index.html">Home</a>
          <a href="DoctorLogin.html">Login</a>
          <a href="DoctorRegistration.html">Registration</a>
          <a href="DoctorPrescription.html">Prescription</a>
          <a href="DoctorSchedule.html">Schedule</a>
          <a href="DoctorLeave.html" class="active">Leave</a>
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <h1>Leave Application</h1>

        <form id="leaveForm" onsubmit="return validateLeave(event);" novalidate>
          <!-- Leave Details Fieldset -->
          <fieldset>
            <legend>Leave Details</legend>

            <div class="row">
              <label for="leaveType">Leave Type:</label>
              <div class="field">
                <select id="leaveType">
                  <option value="">-- Select Leave Type --</option>
                  <option value="Casual Leave">Casual Leave</option>
                  <option value="Sick Leave">Sick Leave</option>
                  <option value="Annual Leave">Annual Leave</option>
                  <option value="Emergency Leave">Emergency Leave</option>
                </select>
                <span class="error" id="leaveTypeErr"></span>
              </div>
            </div>

            <div class="row">
              <label for="fromDate">From Date:</label>
              <div class="field">
                <input type="date" id="fromDate" />
                <span class="error" id="fromDateErr"></span>
              </div>
            </div>

            <div class="row">
              <label for="toDate">To Date:</label>
              <div class="field">
                <input type="date" id="toDate" />
                <span class="error" id="toDateErr"></span>
              </div>
            </div>

            <div class="row">
              <label for="reason">Reason:</label>
              <div class="field">
                <textarea
                  id="reason"
                  rows="3"
                  placeholder="Explain the reason for leave"
                  maxlength="300"
                  oninput="updateCharCount()"
                ></textarea>
                <span class="char-count" id="charCount">0 / 300 characters</span>
                <span class="error" id="reasonErr"></span>
              </div>
            </div>

            <div class="row">
              <label for="certificate">Medical Certificate:</label>
              <div class="field">
                <input
                  type="file"
                  id="certificate"
                  accept=".pdf,.jpg,.jpeg,.png"
                />
                <span class="hint"
                  >Required for sick leave longer than 3 days (PDF, JPG or PNG, up
                  to 2 MB)</span
                >
                <span class="error" id="certificateErr"></span>
              </div>
            </div>
          </fieldset>

          <!-- While You Are Away Fieldset -->
          <fieldset>
            <legend>While You Are Away</legend>

            <div class="row">
              <label for="subDoctor">Substitute Doctor:</label>
              <div class="field">
                <input
                  type="text"
                  id="subDoctor"
                  placeholder="Full name of substitute"
                />
                <span class="error" id="subDoctorErr"></span>
              </div>
            </div>

            <div class="row">
              <label for="contactNumber">Contact Number:</label>
              <div class="field">
                <input
                  type="tel"
                  id="contactNumber"
                  placeholder="e.g. 01712345678"
                  maxlength="11"
                />
                <span class="error" id="contactNumberErr"></span>
              </div>
            </div>
          </fieldset>

          <p class="message" id="formMsg"></p>

          <div class="buttons">
            <button type="submit" class="btn primary">Apply</button>
            <button type="button" class="btn secondary" onclick="resetForm()">
              Reset
            </button>
          </div>
        </form>
      </main>
    </div>

    <script src="js/leave.js"></script>
  </body>
</html>
